# Kandev plugin manifest: the declarative contract between this plugin and a
# Kandev host. `id` must match the Go module name, the id passed to
# window.registerKandevPlugin in ui/src/bundle.ts, and the Makefile BIN name.
id: "kandev-plugin-azure-devops"
api_version: 2
version: "0.1.0"
# Floor of the plugin SDK this repository builds against (sdk-release.json).
# Raised at release to the first Kandev release without the built-in
# Azure DevOps integration.
min_kandev_version: "0.100.0"
display_name: "Azure DevOps"
description: "Connect Azure DevOps Services to native Kandev repository, work item, pull request, task, and watch workflows."
author: "JnManso"
categories: ["connector"]
repo_url: "https://github.com/JnManso/kandev-plugin-azure-devops"
icon: "assets/icon.svg"

# runtime.executables maps each supported platform to the binary Kandev spawns
# as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds only the current one.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# Declare only what is used. state and secrets keep the workspace connection,
# its credential, task links, and watches; api_read lets the pollers list
# workspaces, the Git credential handler and pull request creation verify task
# repositories, link cleanup and watch limits read tasks, and the watch editor
# list workflows and the profiles the plugin may launch with; api_write lets
# watches create tasks; user_state keeps each user's browse preferences;
# task.deleted removes a deleted task's links.
capabilities:
  state: true
  secrets: true
  user_state: true
  api_read: ["workspaces", "repositories", "tasks", "workflows", "agent_profiles", "executor_profiles"]
  api_write: ["tasks"]
  events: ["task.deleted"]

# Browser and host actions. Bodies are untrusted and bounded; Kandev
# authorizes the workspace and passes it as verified context.
actions:
  - { key: "connection.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "connection.save", scope: "workspace", max_body_bytes: 16384 }
  - { key: "connection.test", scope: "workspace", max_body_bytes: 16384 }
  - { key: "connection.copy", scope: "workspace", max_body_bytes: 4096 }
  - { key: "connection.delete", scope: "workspace", max_body_bytes: 1024 }
  - { key: "oauth.availability", scope: "workspace", max_body_bytes: 1024 }
  - { key: "oauth.start", scope: "workspace", max_body_bytes: 16384 }
  - { key: "oauth.complete", scope: "workspace", max_body_bytes: 16384 }
  - { key: "oauth.sign_out", scope: "workspace", max_body_bytes: 1024 }
  - { key: "workspaces.describe", scope: "workspace", max_body_bytes: 16384 }
  - { key: "projects.list", scope: "workspace", max_body_bytes: 1024 }
  - { key: "projects.repositories", scope: "workspace", max_body_bytes: 1024 }
  - { key: "teams.list", scope: "workspace", max_body_bytes: 1024 }
  - { key: "teams.settings", scope: "workspace", max_body_bytes: 1024 }
  - { key: "sprints.board", scope: "workspace", max_body_bytes: 1024 }
  - { key: "boards.list", scope: "workspace", max_body_bytes: 1024 }
  - { key: "boards.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "boards.children", scope: "workspace", max_body_bytes: 16384 }
  - { key: "boards.update_item", scope: "workspace", max_body_bytes: 4096 }
  - { key: "work_items.search", scope: "workspace", max_body_bytes: 16384 }
  - { key: "work_items.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "work_items.comments", scope: "workspace", max_body_bytes: 4096 }
  - { key: "work_items.update", scope: "workspace", max_body_bytes: 4096 }
  - { key: "pull_requests.list", scope: "workspace", max_body_bytes: 4096 }
  - { key: "pull_requests.people", scope: "workspace", max_body_bytes: 1024 }
  - { key: "pull_requests.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "pull_requests.feedback", scope: "workspace", max_body_bytes: 1024 }
  - { key: "identity.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "views.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "views.save", scope: "workspace", max_body_bytes: 600000 }
  - { key: "workspace_settings.get", scope: "workspace", max_body_bytes: 1024 }
  - { key: "workspace_settings.patch", scope: "workspace", max_body_bytes: 262144 }
  - { key: "repositories.list", scope: "workspace", max_body_bytes: 16384 }
  - { key: "repositories.inspect", scope: "workspace", max_body_bytes: 16384 }
  - { key: "repositories.branches", scope: "workspace", max_body_bytes: 16384 }
  - { key: "task_links.workspace", scope: "workspace", max_body_bytes: 1024 }
  - { key: "task_links.get", scope: "task", max_body_bytes: 1024 }
  - { key: "pull_requests.link", scope: "task", max_body_bytes: 4096 }
  - { key: "pull_requests.unlink", scope: "task", max_body_bytes: 4096 }
  - { key: "pull_requests.create", scope: "task", max_body_bytes: 65536 }
  - { key: "work_items.link", scope: "task", max_body_bytes: 4096 }
  - { key: "work_items.unlink", scope: "task", max_body_bytes: 4096 }
  - { key: "watches.list", scope: "workspace", max_body_bytes: 1024 }
  - { key: "watches.options", scope: "workspace", max_body_bytes: 1024 }
  - { key: "watches.create", scope: "workspace", max_body_bytes: 65536 }
  - { key: "watches.update", scope: "workspace", max_body_bytes: 65536 }
  - { key: "watches.delete", scope: "workspace", max_body_bytes: 1024 }
  - { key: "watches.trigger", scope: "workspace", max_body_bytes: 1024 }
  - { key: "watches.preview_reset", scope: "workspace", max_body_bytes: 1024 }
  - { key: "watches.reset", scope: "workspace", max_body_bytes: 1024 }

# Repositories with provider `azure_devops`, including rows created by the
# former built-in integration, resolve to this plugin.
repository_providers: ["azure_devops"]

# Composer # references. Kandev asks the plugin to authorize a selection again
# before a message is sent.
reference_sources:
  - source: "azure_work_items"
    provider: "azure_devops"
    kind: "work_item"
    display_name: "Azure DevOps"
    kind_label: "Work item"
    order: 60
  - source: "azure_pull_requests"
    provider: "azure_devops"
    kind: "pull_request"
    display_name: "Azure DevOps"
    kind_label: "Pull request"
    order: 61

# Lets an agent in a task open and link an Azure Repos pull request without
# the az CLI or a credential in its environment.
agent_tools:
  - name: "create_pull_request"
    description: "Open an Azure Repos pull request from a branch you already pushed, and link it to the current Kandev task. Push first (git push -u origin <branch>), then pass that branch as sourceBranch. If the task has several Azure Repos repositories, pass repository as Project/Repository."
    surfaces: ["kanban-task"]
    input_schema:
      type: object
      properties:
        title: { type: string, description: "Pull request title.", minLength: 1, maxLength: 400 }
        description: { type: string, description: "Pull request description in Markdown.", maxLength: 30000 }
        sourceBranch: { type: string, description: "The pushed branch to merge from.", minLength: 1, maxLength: 250 }
        targetBranch: { type: string, description: "The branch to merge into. Defaults to the task base branch or the repository default branch.", maxLength: 250 }
        repository: { type: string, description: "Project/Repository, required only when the task has several Azure Repos repositories.", maxLength: 300 }
        draft: { type: boolean, description: "Open the pull request as a draft." }
      required: ["title", "sourceBranch"]
      additionalProperties: false
    annotations:
      read_only_hint: false
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: true

ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]

# Operator settings at Settings > Plugins > Azure DevOps.
config_schema:
  type: object
  properties:
    default_oauth_client_id:
      type: string
      title: "Default Microsoft application (client) ID"
      description: "Microsoft Entra public client used for Microsoft sign-in when a workspace does not set its own. Leave empty to require a client ID per workspace."
      default: ""
